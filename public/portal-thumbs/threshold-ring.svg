  <ellipse cx="128" cy="126" rx="50" ry="86" fill="url(#core-threshold-ring)" filter="url(#glow-threshold-ring)"/>
  <ellipse cx="128" cy="126" rx="67" ry="98" fill="none" stroke="url(#rim-threshold-ring)" stroke-width="10" filter="url(#glow-threshold-ring)"/>
  <ellipse cx="128" cy="126" rx="43" ry="74" fill="none" stroke="#f8fafc" stroke-width="2" opacity="0.58"/>
