# Nginx config for openclaw.04515.xyz and 04515.xyz.
#
# Place at /etc/nginx/sites-available/openclaw.04515.xyz, symlink to
# /etc/nginx/sites-enabled/, then `nginx -t && systemctl reload nginx`.
#
# Get TLS via certbot:
#   apt install certbot python3-certbot-nginx
#   certbot --nginx -d openclaw.04515.xyz -d 04515.xyz
#
# Certbot will rewrite this file to inject `ssl_certificate*` lines and a
# port-80 → 443 redirect. The `location` blocks below survive that pass.

server {
  listen 80;
  listen [::]:80;
  server_name openclaw.04515.xyz 04515.xyz;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name openclaw.04515.xyz 04515.xyz;

  # TLS certs (managed by certbot --nginx). Symlinks chase into
  # /etc/letsencrypt/archive/<host>/{fullchain,privkey}<N>.pem and are
  # renewed automatically. If certbot ever re-runs against this file,
  # leave these lines uncommented — they're already the production path.
  ssl_certificate     /etc/letsencrypt/live/openclaw.04515.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/openclaw.04515.xyz/privkey.pem;

  # Body cap. 25M covers the application's largest legitimate uploads:
  # audio up to ~15MB (the music-gen output ceiling), images up to 8MB
  # (before they get rejected by /api/media/upload's MIME-typed gate),
  # video frames up to 25MB. The relay's per-frame cap is enforced
  # separately in scripts/openclaw-relay.mjs (RELAY_FRAME_MAX_BYTES,
  # default 8MiB). Don't touch this without also bumping the API-side
  # caps in src/app/api/media/upload/route.ts.
  client_max_body_size 25m;

  # ── User-content static folders ──────────────────────────────────────────
  # Files in public/images, public/generated-*, public/conjured/ get
  # written at runtime by upload + AI-generation routes. Next's static
  # asset middleware caches the public/ manifest at build time, so files
  # added AFTER `next build` snapshot are 404'd by Next.
  # Bypass Next entirely for these prefixes — nginx tail-serves the file
  # from disk on every request, so newly uploaded files appear
  # immediately, no rebuild required.
  # Cache headers stay liberal (immutable hashed filenames per uploader).
  location ~ ^/(images|generated-images|generated-music|generated-videos|generated-voices|conjured)/ {
    root /home/art3mis/openclaw-oasis/public;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # ── Relay WSS ────────────────────────────────────────────────────────────
  # Upgrade headers are non-negotiable here. Long read/send timeouts because
  # paired sockets are long-lived (chat sessions, presence streams).
  #
  # `location = /relay` is EXACT match — `/relay-test` and friends fall through
  # to `location /` and reach Next.js. With a prefix match (just `/relay`),
  # Nginx grabs every URL starting with /relay and proxies it to the WS sidecar,
  # which returns 426 to plain HTTP and breaks the test page.
  location = /relay {
    proxy_pass http://127.0.0.1:4517;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # ── Colyseus Multiplayer Rooms ───────────────────────────────────────────
  # The Colyseus client connects to wss://<host>/rooms and internally hits
  # both POST /rooms/matchmake/* (HTTP) and ws upgrade to /rooms/<roomId>.
  # We strip the /rooms prefix so the server sees /matchmake/* and /<roomId>
  # at its root — that's what Colyseus's matchmaker + WebSocketTransport
  # expect by default.
  location /rooms/ {
    rewrite ^/rooms/(.*) /$1 break;
    proxy_pass http://127.0.0.1:4519;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # ── Next.js app ──────────────────────────────────────────────────────────
  location / {
    proxy_pass http://127.0.0.1:4516;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Cookie $http_cookie;
  }
}
