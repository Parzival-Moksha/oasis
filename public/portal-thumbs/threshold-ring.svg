<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Threshold portal">
  <defs>
    <radialGradient id="core-threshold-ring" cx="50%" cy="45%" r="58%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.95"/>
      <stop offset="42%" stop-color="#67e8f9" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.94"/>
    </radialGradient>
    <linearGradient id="rim-threshold-ring" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="48%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="glow-threshold-ring" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-smoke" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="22" fill="#020617"/>
